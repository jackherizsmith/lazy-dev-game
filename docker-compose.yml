services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lazyadmin
      POSTGRES_PASSWORD: lazypass123
      POSTGRES_DB: lazy_dev_game
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "lazyadmin"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
